events {
    worker_connections 1024;
}

http {
    upstream analytics_backend {
        server analytics:8000 max_fails=3 fail_timeout=5s;
        server analytics-backup:8000 max_fails=3 fail_timeout=5s;
    }

    upstream filter_backend {
        server filter:8000 max_fails=3 fail_timeout=5s;
        server filter-backup:8000 max_fails=3 fail_timeout=5s;
    }

    upstream trend_backend {
        server trend:8000 max_fails=3 fail_timeout=5s;
        server trend-backup:8000 max_fails=3 fail_timeout=5s;
    }

    server {
        listen 80;

        location /analytics/ {
            proxy_pass http://analytics_backend/;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /filter/ {
            proxy_pass http://filter_backend/;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /trend/ {
            proxy_pass http://trend_backend/;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
